<!DOCTYPE html>
<html>
<head>
    <title>User Fraud Check</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background: linear-gradient(135deg, #eef2ff, #f8fafc);">

<!-- Navbar -->
<nav class="navbar px-4 py-2 shadow-sm"
     style="background: linear-gradient(90deg, #0d6efd, #6610f2);">

    <div class="d-flex align-items-center w-100 justify-content-between">

        <span class="fs-4 fw-bold text-white">
            💳 UPI Fraud Detection
        </span>

        <div class="d-flex align-items-center gap-3">

            <span class="badge bg-light text-dark px-3 py-2 fw-semibold">
                👤 {{ session.role|capitalize }}
            </span>

            <a href="/logout"
               class="btn btn-light btn-sm fw-semibold px-3">
                Logout
            </a>

        </div>

    </div>

</nav>

<!-- Payment Form -->
<div class="container mt-5">

    <h2 class="text-center mb-4">
        UPI Payment
    </h2>

    <div class="card shadow p-4">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Receiver UPI ID
                </label>

                <input type="text"
                       name="receiver"
                       class="form-control"
                       placeholder="example@upi"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Amount
                </label>

                <input type="number"
                       step="any"
                       name="amount"
                       class="form-control"
                       placeholder="Enter Amount"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Pay Now

            </button>

        </form>

    </div>

    {% if warning_msg %}
    <div class="alert alert-warning mt-3">
        {{ warning_msg }}
    </div>
    {% endif %}

    <div class="text-center mt-3">

        <a href="/"
           class="btn btn-outline-primary">

            ← Back to Dashboard

        </a>

    </div>

</div>

</body>
</html>
