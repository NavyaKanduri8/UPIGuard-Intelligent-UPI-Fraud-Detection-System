<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background: linear-gradient(135deg, #eef2ff, #f8fafc);">

<!-- Navbar -->
<nav class="navbar px-4 py-2 shadow-sm"
     style="background: linear-gradient(90deg, #0d6efd, #6610f2);">

    <span class="fs-4 fw-bold text-white">
        💳 UPI Fraud Detection
    </span>

</nav>

<!-- Login Card -->
<div class="d-flex align-items-center justify-content-center" style="height: 80vh;">

    <div class="card shadow-lg p-4 rounded-4" style="width: 350px;">

        <h4 class="text-center mb-3 fw-bold">
            Login
        </h4>

        <form method="POST">

            <input type="text"
                   name="username"
                   class="form-control mb-3"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   class="form-control mb-3"
                   placeholder="Password"
                   required>

            <button class="btn btn-primary w-100">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
