<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background: linear-gradient(135deg, #eef2ff, #f8fafc);">

<!-- Navbar -->
<nav class="navbar px-4 py-2 shadow-sm"
     style="background: linear-gradient(90deg, #0d6efd, #6610f2);">

    <div class="d-flex align-items-center w-100 justify-content-between">

        <!-- Left -->
        <span class="fs-4 fw-bold text-white">
            💳 UPI Fraud Detection
        </span>

        <!-- Right -->
        <div class="d-flex align-items-center gap-3">

            <span class="badge bg-light text-dark px-3 py-2 fw-semibold">
                👤 {{ session.role|capitalize }}
            </span>

            <a href="/logout" class="btn btn-light btn-sm fw-semibold px-3">
                Logout
            </a>

        </div>

    </div>

</nav>

<!-- Dashboard -->
<div class="container mt-5 d-flex justify-content-center">

    <div class="card shadow-lg rounded-4 p-4 text-center"
         style="width: 400px;">

        <h3 class="fw-bold">
            Welcome, {{ session.username }} 👋
        </h3>

        <p class="text-muted">
            Make secure UPI payments
        </p>

        <a href="/check" class="btn btn-primary w-100 mt-3">
            💸 Make Payment
        </a>

        <a href="/history" class="btn btn-outline-dark w-100 mt-2">
            📜 Transaction History
        </a>

    </div>

</div>

</body>
</html>
